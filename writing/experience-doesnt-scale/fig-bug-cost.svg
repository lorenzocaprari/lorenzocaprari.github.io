<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#101d30"/></marker></defs>
<rect width="620" height="300" fill="#f4f2ee"/>
<text x="20" y="26" font-family="DejaVu Sans, Verdana, sans-serif" font-size="14" fill="#101d30" text-anchor="start" font-weight="bold">The later a bug is found, the more it costs</text>
<text x="20" y="46" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11.5" fill="#5c6a78" text-anchor="start" font-weight="normal">Same bug, same fix. What changes is where it shows up.</text>
<line x1="60" y1="230" x2="60" y2="64" stroke="#5c6a78" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="60" y1="230" x2="590" y2="230" stroke="#5c6a78" stroke-width="1.5"/>
<text x="38" y="150" font-family="DejaVu Sans, Verdana, sans-serif" font-size="11" fill="#5c6a78" text-anchor="middle" transform="rotate(-90 38 150)">cost to fix</text>
<rect x="110" y="208" width="110" height="22" fill="#101d30"/>
<text x="165" y="252" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#101d30" text-anchor="middle" font-weight="bold">On your machine</text>
<text x="165" y="270" font-family="DejaVu Sans, Verdana, sans-serif" font-size="10.5" fill="#5c6a78" text-anchor="middle" font-weight="normal">a test fails, you fix it</text>
<rect x="270" y="174" width="110" height="56" fill="#101d30"/>
<text x="325" y="252" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#101d30" text-anchor="middle" font-weight="bold">In CI</text>
<text x="325" y="270" font-family="DejaVu Sans, Verdana, sans-serif" font-size="10.5" fill="#5c6a78" text-anchor="middle" font-weight="normal">the pull request goes red</text>
<rect x="430" y="80" width="110" height="150" fill="#2ba597"/>
<text x="485" y="252" font-family="DejaVu Sans, Verdana, sans-serif" font-size="12" fill="#101d30" text-anchor="middle" font-weight="bold">In the field</text>
<text x="485" y="270" font-family="DejaVu Sans, Verdana, sans-serif" font-size="10.5" fill="#5c6a78" text-anchor="middle" font-weight="normal">a customer, a trip, firefighting</text>
<path d="M165 196 C 260 170, 380 110, 470 68" fill="none" stroke="#101d30" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
