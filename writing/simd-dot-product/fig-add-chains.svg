<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" role="img" aria-labelledby="t">
<title id="t">One chain of 384 additions versus four chains of eight lanes</title>
<style>
text{font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#101D30}
.h{font-size:19px;font-weight:600}
.c{font-size:16px;fill:#5C6A78}
.m{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:15px}
.p{font-size:18px;font-weight:600;fill:#FFFFFF}
.a{stroke:#5C6A78;stroke-width:1.5;fill:none;marker-end:url(#h)}
.b{stroke:#5C6A78;stroke-width:1.5;fill:none}
