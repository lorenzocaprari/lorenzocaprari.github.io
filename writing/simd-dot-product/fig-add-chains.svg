<text class="h" x="20" y="204">Four chains, eight lanes</text>
<text class="c" x="20" y="226">Four 8-wide accumulators: 32 independent partial sums</text>
<g id="row">
<use href="#ymm" x="70" y="245"/><use href="#ymm" x="124" y="245"/><use href="#ymm" x="178" y="245"/><use href="#ymm" x="232" y="245"/>
<path class="a" d="M110 257h12M164 257h12M218 257h12M272 257h14"/>
