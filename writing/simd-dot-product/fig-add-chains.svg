<path class="a" d="M314 257h14"/>
<use href="#ymm" x="330" y="245"/>
</g>
<text class="m" x="20" y="262">sum0</text>
<use href="#row" y="36"/><use href="#row" y="72"/><use href="#row" y="108"/>
<text class="m" x="20" y="298">sum1</text>
<text class="m" x="20" y="334">sum2</text>
<text class="m" x="20" y="370">sum3</text>
<path class="a" d="M370 257C410 257 420 300 438 306M370 293C405 293 420 306 438 309M370 329C405 329 420 316 438 313M370 365C410 365 420 322 438 316"/>
